  DUPLICATE_REG_NO_IN_FILE: 'Same REG NO used twice in this file',
  DUPLICATE_DL_NO_IN_FILE: 'Two people share one DL number',
  DUPLICATE_NATIONAL_ID_IN_FILE: 'Two people share one national ID',
  MISSING_REG_NO: 'REG NO is empty', MISSING_NAME: 'Name is empty', MISSING_SURNAME: 'Surname is empty',
  MISSING_COMPANY: 'Company is empty', BAD_EXPIRE_DATE: 'Expiry date cannot be read',
  BAD_DOB: 'Date of birth cannot be read', MISSING_EXPIRE_DATE: 'Renewal with no expiry date',
  ALREADY_EXPIRED: 'Licence already expired', AMOUNT_MISMATCH: 'Licence fee does not match the category',
  PROCESS_FEE_MISMATCH: 'Process fee does not match new or renewal', UNKNOWN_LICENSE_TYPE: 'Unknown licence category',
  MISSING_LICENSE_TYPE: 'Category is empty', MISSING_EYE_TEST_FEE: 'No eye test fee recorded',
  MISSING_NATIONAL_ID: 'No national ID or passport number', MISSING_PHONE: 'No phone number',
  PHONE_FORMAT: 'Phone number in an unusual format', DL_NO_FORMAT: 'DL number in an unusual format'
};
function issueList(s) {
  var items = Object.keys(s.issueCounts).map(function (k) { return s.issueCounts[k]; });
  var order = { blocking: 0, warning: 1, info: 2 };
  items.sort(function (a, b) { return order[a.severity] - order[b.severity] || b.count - a.count; });
  if (!items.length) return '<div class="empty">Nothing flagged.</div>';
  return items.map(function (i) {
    return '<button class="issue ' + i.severity + (S.imp.issue === i.code ? ' on' : '') + '" data-act="issue" data-v="' + i.code + '">' +
      '<span class="dot"></span><span class="txt">' + esc(LABELS[i.code] || i.code) +
      '<small>#' + i.rows.slice(0, 8).join(', #') + (i.rows.length > 8 ? ' and ' + (i.rows.length - 8) + ' more' : '') + '</small></span>' +
      '<span class="cnt">' + i.count + '</span></button>';
  }).join('');
}
function viewImport() {
  if (!S.parsed) {
    return '<div class="drop" id="drop"><h2>Drop the monthly workbook here</h2>' +
      '<p>One company per file, first sheet is read. Nothing is saved until you import.</p>' +
      '<button class="btn" data-act="pickfile">Choose a file</button>' +
      '<input type="file" id="file" accept=".xlsx,.xlsm,.xls" hidden></div>';
  }
  var res = S.parsed, s = res.summary, blocked = s.blocking > 0, f = S.imp;
  var rows = res.rows.filter(function (r) {
    if (f.severity !== 'all' && r.severity !== f.severity) return false;
    if (f.issue && !r.issues.some(function (i) { return i.code === f.issue; })) return false;
    if (f.q && (r.regNo + ' ' + r.name + ' ' + r.surname).toLowerCase().indexOf(f.q.toLowerCase()) === -1) return false;
    return true;
  });
  return '<div class="grid-head">' +
    '<div class="tag ' + (blocked ? 'blocked' : 'ready') + '"><div class="band"></div><div class="body">' +
      '<div class="punch"></div><div class="eyebrow">Batch</div>' +
      '<input class="batch" id="batchName" value="' + esc(res.suggestedBatch || res.sheetName) + '">' +
      '<div class="meta mono">' + esc(Object.keys(s.byCompany).join(' · ') || '—') + ' · ' + s.total + ' people</div>' +
      '<div class="total"><small>Total cost (USD)</small>' + P.money(s.money.total) + '</div>' +
      '<div class="verdict">' + (blocked ? 'Fix before importing' : 'Ready to import') + '<em>' +
      (blocked ? s.blocking + ' row(s) cannot be imported.' : 'Warnings are recorded, not stopped.') + '</em></div>' +
    '</div></div>' +
    '<div><div class="meters">' + meter(s.total, 'Rows read', '') + meter(s.clean, 'Clean', 'good') +
      meter(s.warning, 'Warnings', 'warn') + meter(s.blocking, 'Blocked', s.blocking ? 'bad' : '') +
      meter(s.byApplicationType['New'] || 0, 'New licences', '') +
      meter(s.expiry.expired, 'Already expired', s.expiry.expired ? 'warn' : '') + '</div>' +
      '<div class="panel" style="margin-top:20px"><h3>What needs attention</h3>' + issueList(s) + '</div></div></div>' +
    '<div class="toolbar">' + ['all', 'blocking', 'warning', 'info', 'clean'].map(function (k) {
        var label = { all: 'All', blocking: 'Blocked', warning: 'Warnings', info: 'Notes', clean: 'Clean' }[k];
        var n = { all: s.total, blocking: s.blocking, warning: s.warning, info: s.info, clean: s.clean }[k];
        return '<button class="chip ' + (k === 'blocking' ? 'bad' : k === 'warning' ? 'warn' : '') +
          (f.severity === k && !f.issue ? ' on' : '') + '" data-act="sev" data-v="' + k + '">' + label +
          '<span class="c">' + n + '</span></button>';
      }).join('') +
      '<input type="search" data-bind="imp.q" placeholder="REG NO, name…" value="' + esc(f.q) + '">' +
      '<div class="grow"><span class="count">' + rows.length + ' of ' + res.rows.length + '</span>' +
      '<button class="btn ghost" data-act="impclear">Clear filters</button></div></div>' +
    '<div class="tablewrap"><table><thead><tr><th></th><th>#</th><th>REG NO</th><th>Name</th><th>Surname</th>' +
      '<th>Company</th><th>Category</th><th>New / renewal</th><th>DL NO</th><th>Expires</th><th>Location</th>' +
      '<th class="num">Total</th><th>Flags</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr class="' + r.severity + '"><td class="gutter"><div></div></td>' +
          '<td class="rowno">' + r.index + '</td><td class="id">' + esc(r.regNo) + '</td>' +
          '<td>' + esc(r.name) + '</td><td>' + esc(r.surname) + '</td><td>' + esc(r.company) + '</td>' +
          '<td>' + esc(r.licenseType) + '</td>' +
          '<td><span class="badge' + (r.applicationType === 'New' ? ' new' : '') + '">' + r.applicationType + '</span></td>' +
          '<td class="id">' + (r.dlNo ? esc(r.dlNo) : dash()) + '</td>' +
          '<td class="id">' + (r.dlExpireDate ? P.formatDate(r.dlExpireDate) : dash()) + '</td>' +
          '<td>' + esc(r.location) + '</td><td class="num">' + num(r.total) + '</td>' +
          '<td class="flagcell">' + (r.issues.length || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
    '<div class="actions"><button class="btn" data-act="commit"' + (blocked || !S.net.online ? ' disabled' : '') + '>Import ' +
      (res.rows.length - s.blocking) + ' people</button>' +
      '<button class="btn ghost" data-act="resetimport">Load another file</button>' +
      '<div class="note">' + (blocked ? 'Blocked rows are left out. Fix them in the workbook and load it again.'
        : 'Anyone who already has an open application is reported and skipped.') + '</div></div>';
}

/* ================= actions ================= */
var toastTimer = null;
function toast(msg) {
  var t = $('#toast'); if (!t) return;
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
}
function post(path, body, okMsg) {
  return api(path, { method: 'POST', body: body, timeout: 60000 })
    .then(function (r) {
      S.net.error = (r && r.refused && r.refused.length)
        ? r.refused.length + ' refused — ' + (r.refused[0].reason || '') : '';
      if (okMsg) toast(okMsg(r));
      S.bulk.selected = {};
      return pullFresh(true);
    })
    .catch(function (err) {
      S.net.error = err.offline ? 'No connection to the office server.' : err.message;
      render();
    });
}
function downloadPhotos(ids) {
  if (!ids.length) return;
  toast('Collecting ' + ids.length + ' ' + (ids.length === 1 ? 'person' : 'people') + '…');
  api('/api/photos/export', { method: 'POST', body: { application_ids: ids }, raw: true, timeout: 300000 })
    .then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'DL_Photos_' + S.today.split('-').reverse().join('-') + '.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 8000);
      S.bulk.selected = {};
      toast('Downloaded');
      render();
    })
    .catch(function (err) {
      S.net.error = err.offline ? 'Downloading photographs needs a connection to the office server.' : err.message;
      render();
    });
}

function downloadExcel() {
  var q = S.list.batch !== 'all' ? '?batch_id=' + S.list.batch : '';
  toast('Building the workbook…');
  api('/api/report.xlsx' + q, { raw: true, timeout: 120000 }).then(function (blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'DL_Report_' + S.today.split('-').reverse().join('-') + '.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('Downloaded');
  }).catch(function (err) {
    S.net.error = err.offline ? 'The report needs a connection to the office server.' : err.message;
    render();
  });
}
function canvasWorks() { try { return !!document.createElement('canvas').getContext('2d'); } catch (e) { return false; } }
function shrink(dataUrl, done) {
  if (!canvasWorks()) { done(null); return; }
  var img = new Image();
  img.onload = function () {
    try {
      var s = Math.min(1, 1280 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      done(c.toDataURL('image/jpeg', 0.72), c.width, c.height);
    } catch (e) { done(null); }
  };
  img.onerror = function () { done(null); };
  img.src = dataUrl;
}
function readWorkbook(file) {
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var wb = XLSX.read(new Uint8Array(fr.result), { type: 'array', cellDates: true });
      var sheet = wb.SheetNames[0];
      var matrix = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { header: 1, raw: true, defval: null, blankrows: false });
      S.parsed = P.parseMatrix(matrix, { fileName: file.name, sheetName: sheet });
      S.imp = freshImp();
      render();
    } catch (err) { alert('That file could not be read as a workbook.\n\n' + err.message); }
  };
  fr.readAsArrayBuffer(file);
}
function commitImport() {
  var res = S.parsed; if (!res) return;
  var name = ($('#batchName') && $('#batchName').value.trim()) || res.suggestedBatch;
  var rows = res.rows.filter(function (r) { return r.severity !== 'blocking'; }).map(function (r) {
    return { index: r.index, regNo: r.regNo, company: r.company, name: r.name, surname: r.surname,
      department: r.department, jobTitle: r.jobTitle, location: r.location, licenseType: r.licenseType,
      dlNo: r.dlNo, dlClass: r.dlClass, dlExpireDate: r.dlExpireDate ? iso(r.dlExpireDate) : null,
      nationalId: r.nationalId, dateOfBirth: r.dateOfBirth ? iso(r.dateOfBirth) : null, phone: r.phone,
      amount: r.amount, processFee: r.processFee, drivingTestFee: r.drivingTestFee,
      eyeTestFee: r.eyeTestFee, billNumber: r.billNumber, note: r.note };
  });
  api('/api/import', { method: 'POST', timeout: 180000,
    body: { batch_name: name, source_file: res.fileName, sheet_name: res.sheetName, rows: rows,
            findings: res.summary.issueCounts } })
    .then(function (r) {
      S.parsed = null;
      toast(r.imported + ' imported' + (r.skipped.length ? ', ' + r.skipped.length + ' skipped' : ''));
      S.net.error = r.skipped.length
        ? 'Skipped: ' + r.skipped.slice(0, 5).map(function (x) { return x.reg_no + ' (' + x.reason + ')'; }).join('; ') : '';
      S.screen = 'batches';
      return pullFresh(true);
    })
    .catch(function (err) {
      S.net.error = err.offline ? 'Importing needs a connection to the office server.' : err.message;
      render();
    });
}
function setPath(path, value) {
  var p = path.split('.'), o = S;
  for (var i = 0; i < p.length - 1; i++) o = o[p[i]];
  o[p[p.length - 1]] = value;
}

/* ================= events ================= */
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');

  if (act === 'signin') return signIn(($('#email') || {}).value || '', ($('#password') || {}).value || '');
  if (act === 'signout') { if (confirm('Sign out of this device?')) signOut(); return; }
  if (act === 'sync') { flush(); return; }
  if (act === 'go') { go(el.getAttribute('data-id')); return; }
  if (act === 'excel') { downloadExcel(); return; }
  if (act === 'pickfile') { $('#file').click(); return; }
  if (act === 'resetimport') { S.parsed = null; render(); return; }
  if (act === 'commit') { commitImport(); return; }
  if (act === 'sev') { S.imp.severity = v; S.imp.issue = null; render(); return; }
  if (act === 'issue') { S.imp.issue = S.imp.issue === v ? null : v; S.imp.severity = 'all'; render(); return; }
  if (act === 'impclear') { S.imp = freshImp(); render(); return; }
  if (act === 'listclear') { S.list = { q: '', batch: 'all', status: 'all', company: 'all', location: 'all', app: 'all', paid: 'all' }; render(); return; }

  if (act === 'approve' || act === 'reject') {
    var on = $('#appr_' + v) ? $('#appr_' + v).value : S.today;
    return post('/api/batches/' + v + '/approval',
      { status: act === 'approve' ? 'Approved' : 'Rejected', gm_signed_on: on },
      function () { return 'Batch ' + (act === 'approve' ? 'approved' : 'rejected'); });
  }
  if (act === 'mode') { S.bulk.mode = v; S.bulk.selected = {}; S.bulk.pasteReport = null; S.bulk.renewing = null; render(); return; }
  if (act === 'tickrow') { if (S.bulk.selected[v]) delete S.bulk.selected[v]; else S.bulk.selected[v] = true; render(); return; }
  if (act === 'selall') {
    var elig = bulkRows().filter(function (a) { return eligibility(a, S.bulk.mode).ok; });
    var allOn = elig.length && elig.every(function (a) { return S.bulk.selected[a.id]; });
    elig.forEach(function (a) { if (allOn) delete S.bulk.selected[a.id]; else S.bulk.selected[a.id] = true; });
    render(); return;
  }
  if (act === 'selnone') { S.bulk.selected = {}; render(); return; }
  if (act === 'togglepaste') { S.bulk.showPaste = !S.bulk.showPaste; S.bulk.pasteReport = null; render(); return; }
  if (act === 'pasteclear') { S.bulk.paste = ''; S.bulk.pasteReport = null; render(); return; }
  if (act === 'pastesel') {
    var seen = {}, rep = { picked: 0, blocked: [], missing: [] }, pool = bulkRows();
    splitList(S.bulk.paste).forEach(function (reg) {
      var k = reg.toUpperCase();
      if (seen[k]) return; seen[k] = true;
      var hit = null;
      pool.forEach(function (a) { if (a.reg_no.toUpperCase() === k) hit = a; });
      if (!hit) { rep.missing.push(reg); return; }
      if (!eligibility(hit, S.bulk.mode).ok) { rep.blocked.push(reg); return; }
      S.bulk.selected[hit.id] = true; rep.picked++;
    });
    S.bulk.pasteReport = rep; render(); return;
  }
  if (act === 'applysel') {
    var ids = selectedApps().map(function (a) { return a.id; });
    var when = S.bulk.date || S.today;
    if (S.bulk.mode === 'photos') return downloadPhotos(ids);
    if (S.bulk.mode === 'payment')
      return post('/api/payments', { application_ids: ids, bill_number: S.bulk.bill, payment_date: when },
        function (r) { return r.applied.length + ' payment(s) recorded'; });
    if (S.bulk.mode === 'appointment')
      return post('/api/appointments', { application_ids: ids, appointment_date: when },
        function (r) { return r.applied.length + ' appointment(s) booked'; });
    return post('/api/deliveries', { application_ids: ids, delivered_on: when },
      function (r) { return r.applied.length + ' delivery(ies) recorded'; });
  }
  if (act === 'selfrenew') { S.bulk.renewing = Number(v); render(); return; }
  if (act === 'selfrenewcancel') { S.bulk.renewing = null; render(); return; }
  if (act === 'selfrenewsave') {
    var body = { application_ids: [Number(v)],
      self_renewed_on: ($('#srDate') || {}).value || S.today,
      dl_no: ($('#srDl') || {}).value || '', dl_class: ($('#srClass') || {}).value || '',
      dl_expire_date: ($('#srExp') || {}).value || null, note: ($('#srNote') || {}).value || '' };
    S.bulk.renewing = null;
    return post('/api/self-renewals', body, function () { return 'Marked as renewed on their own'; });
  }
  if (act === 'undorenew')
    return post('/api/self-renewals/undo', { application_ids: [Number(v)] }, function () { return 'Undone'; });

  if (act === 'viewphoto') { S.office.viewing = v; render(); return; }
  if (act === 'closeview') { S.office.viewing = null; render(); return; }
  if (act === 'canceledit') { S.office.editing = null; render(); return; }
  if (act === 'attend' || act === 'noshow' || act === 'complete' || act === 'finish') {
    var app = findApp(v); if (!app) return;
    if (act === 'complete') { S.office.editing = app.id; render(); return; }
    var block = blockTick(app);
    if (block) { alert(block); return; }
    if (act === 'attend') return queueEvent(app, 'ATTENDED');
    if (act === 'noshow') return queueEvent(app, 'NO_SHOW');
    var extra = { dl_class: ($('#fClass') || {}).value || '', dl_no: ($('#fDl') || {}).value || '' };
    S.office.editing = null;
    return queueEvent(app, 'COMPLETED', extra);
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || S.session) return;
  if (e.target.id === 'email') {
    e.preventDefault();
    S.login.email = e.target.value;
    var pw = $('#password');
    if (pw) pw.focus();                  // Enter here means "next field", not "sign in"
    return;
  }
  if (e.target.id === 'password') {
    e.preventDefault();
    signIn(($('#email') || {}).value || '', e.target.value || '');
  }
});

document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'file') { if (t.files[0]) readWorkbook(t.files[0]); return; }
  var side = t.getAttribute && t.getAttribute('data-photo');
  if (side) {
    var app = findApp(t.getAttribute('data-app'));
    if (!app || !t.files || !t.files[0]) return;
    var block = blockTick(app);
    if (block) { alert(block); return; }
    var fr = new FileReader();
    fr.onload = function () {
      shrink(fr.result, function (small, w, h) { queuePhoto(app, side, small || fr.result, w, h); });
    };
    fr.readAsDataURL(t.files[0]);
    return;
  }
  var bind = t.getAttribute && t.getAttribute('data-bind');
  if (!bind) return;
  setPath(bind, t.type === 'checkbox' ? t.checked : t.value);
  if (bind === 'bulk.batch') S.bulk.selected = {};
  render();
});

document.addEventListener('input', function (e) {
  var t = e.target, bind = t.getAttribute && t.getAttribute('data-bind');
  if (!bind) return;
  if (bind === 'login.email' || bind === 'login.password') { setPath(bind, t.value); return; }
  if (t.type !== 'search' && t.tagName !== 'TEXTAREA') return;
  setPath(bind, t.value);
  if (bind === 'bulk.paste') {
    var b = document.querySelector('[data-act="pastesel"]');
    if (b) b.textContent = 'Tick ' + splitList(t.value).length + ' entries';
    return;
  }
  var pos = t.selectionStart;
  render();
  var again = document.querySelector('[data-bind="' + bind + '"]');
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (x) {} }
});

['dragover', 'drop'].forEach(function (ev) {
  document.addEventListener(ev, function (e) {
    if (S.screen !== 'import' || S.parsed) return;
    e.preventDefault();
    var d = $('#drop'); if (d) d.classList.toggle('over', ev === 'dragover');
    if (ev === 'drop' && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) readWorkbook(e.dataTransfer.files[0]);
  });
});

S.bulk.date = S.today;
S.office.date = S.today;
boot();
})();

</script>
</body>
